aid: 4dlifetec
name: 4D Lifetec
description: >-
  4D Lifetec AG is a Swiss in-vitro diagnostics company headquartered at Gewerbestrasse 8, 6330 Cham,
  Switzerland, developing the 4D Lifetest — a non-invasive, immuno-oncological blood test for the early
  detection of cancer. The test reads a proprietary DNA Damage Sensitivity (DDS) biomarker from a liquid
  biopsy using single-cell gel electrophoresis (the comet assay), run on the company's own 4D Lifechamber
  instrument for a fully automated and standardized procedure and scored by 4D LifeAI, its trained image
  analysis software. The flagship product is 4D Lifetest Lung Dx, with 4D Lifetest Breast Dx, Prostate Dx
  and Colon Dx as further assays in the same platform, and the company holds patent protection across the
  US, Europe, China and other territories. 4D Lifetec is a diagnostics manufacturer and laboratory-services
  company, not a software vendor. Its public web presence is an eight-page SilverStripe marketing and
  investor-relations site with no developer portal, no API reference, no SDKs, no public GitHub
  organization and no machine-readable specification of any kind; probing every documented contract
  location on 4dlifetec.com — /openapi.json, /swagger.json, /api-docs, /graphql, /llms.txt and the full
  /.well-known/ path list — returned the site's SilverStripe 404 page in every case, and no api, docs,
  developer, portal or app subdomain resolves in DNS. The only software the company describes, 4D LifeAI,
  is embedded in the instrument rather than exposed as a service.
